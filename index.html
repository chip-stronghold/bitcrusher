<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1146">
<title>BITCRUSHER ][</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="crt" aria-hidden="true"></div>

  <main class="cabinet">
    <header class="marquee">
      <h1 id="marquee-title" class="title" data-text="BITCRUSHER">BITCRUSHER</h1>
      <p id="marquee-sub" class="sub">★ 16-BIT AUDIO CRUNCHER ★</p>
    </header>

    <nav class="mode-tabs" aria-label="mode">
      <button type="button" id="tab-crush" class="tab is-active" data-mode="crush">BITCRUSHER</button>
      <button type="button" id="tab-granny" class="tab" data-mode="granny">GRANNY VO</button>
    </nav>

    <section class="screen" aria-label="recorder">
      <div class="hud">
        <span class="hud-label">STATUS</span>
        <span id="status" class="hud-value">READY</span>
        <span class="hud-spacer"></span>
        <span class="hud-label">TIME</span>
        <span id="timer" class="hud-value">5.0</span>
      </div>

      <div class="stage">
        <div id="rec-indicator" class="rec-dot" aria-hidden="true"></div>
        <button id="record" class="btn-rec" type="button" aria-label="Record">
          <span class="btn-rec-inner">REC</span>
        </button>
        <p id="hint" class="hint">PRESS START TO RECORD 5 SEC</p>
        <div class="divider" aria-hidden="true"><span>OR</span></div>
        <button id="load-fx" class="btn btn-load" type="button">LOAD SOUND FX</button>
        <input id="file-input" type="file" accept="audio/*" hidden>
      </div>

      <div class="meter" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>
    </section>

    <section class="panel mode-panel" id="panel-crush" aria-label="bitcrusher controls">
      <div class="panel-row">
        <label class="lbl" for="preset">PRESET</label>
        <div class="select-wrap">
          <select id="preset" class="select">
            <option value="clean">CLEAN — 16 BIT / 44100 HZ</option>
            <option value="snes" selected>SNES — 8 BIT / 16000 HZ</option>
            <option value="arcade">ARCADE — 6 BIT / 11025 HZ</option>
            <option value="destroyed">DESTROYED — 4 BIT / 8000 HZ</option>
            <option value="custom">CUSTOM</option>
          </select>
        </div>
      </div>

      <div class="panel-row slider-row">
        <label class="lbl" for="bits">BITS</label>
        <input id="bits" class="slider" type="range" min="1" max="16" step="1" value="8">
        <output id="bits-val" class="readout">08</output>
      </div>

      <div class="panel-row slider-row">
        <label class="lbl" for="rate">RATE</label>
        <input id="rate" class="slider" type="range" min="2000" max="44100" step="100" value="16000">
        <output id="rate-val" class="readout">16000</output>
      </div>
    </section>

    <section class="panel mode-panel" id="panel-granny" aria-label="granny voice controls" hidden>
      <div class="panel-row">
        <label class="lbl" for="granny-preset">PRESET</label>
        <div class="select-wrap">
          <select id="granny-preset" class="select">
            <option value="sweet">SWEET — GENTLE GRANDMA</option>
            <option value="cranky" selected>CRANKY — GRUMPY OLD LADY</option>
            <option value="witch">WITCH — FULL CACKLE</option>
            <option value="custom">CUSTOM</option>
          </select>
        </div>
      </div>

      <div class="panel-row slider-row">
        <label class="lbl" for="pitch">PITCH</label>
        <input id="pitch" class="slider" type="range" min="0" max="12" step="1" value="5">
        <output id="pitch-val" class="readout">+5</output>
      </div>

      <div class="panel-row slider-row">
        <label class="lbl" for="wobble">WOBBLE</label>
        <input id="wobble" class="slider" type="range" min="0" max="100" step="1" value="32">
        <output id="wobble-val" class="readout">32%</output>
      </div>

      <div class="panel-row slider-row">
        <label class="lbl" for="wobble-rate">RATE</label>
        <input id="wobble-rate" class="slider" type="range" min="20" max="90" step="1" value="55">
        <output id="wobble-rate-val" class="readout">5.5HZ</output>
      </div>

      <div class="panel-row slider-row">
        <label class="lbl" for="age">AGE</label>
        <input id="age" class="slider" type="range" min="0" max="100" step="1" value="65">
        <output id="age-val" class="readout">65%</output>
      </div>
    </section>

    <section class="panel preview-panel" aria-label="preview and export">
      <audio id="preview" controls preload="metadata"></audio>
      <div class="actions">
        <button id="reset" class="btn btn-alt" type="button" disabled>RESET</button>
        <a id="download" class="btn btn-primary disabled" role="button" aria-disabled="true" download>DOWNLOAD WAV</a>
      </div>
    </section>

    <footer class="coin">
      <span class="blink">★</span> INSERT COIN TO CONTINUE <span class="blink">★</span>
    </footer>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
